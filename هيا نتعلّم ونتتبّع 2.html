<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هيا نتعلّم ونتتبّع</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#fff9d9;--cd:#fff;--ink:#23406b;--ac:#ff8a3d;--ok:#2fb36d;--dt:#8aa0c8;--ln:#d6e6fb;--sh:#eadf9c;--dr:2.4px;--gw:3;--sp:1.5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
.bar{display:flex;gap:8px;align-items:center;padding:10px 14px;max-width:760px;margin:auto}
.bar .sp{flex:1}
.btn{font:inherit;font-weight:700;font-size:1.05rem;border:0;border-radius:20px;padding:10px 18px;background:var(--cd);color:var(--ink);box-shadow:0 4px 0 var(--sh);cursor:pointer;min-height:48px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
.btn.pr{background:var(--ac);color:#fff;box-shadow:0 4px 0 #c9541a}
main{max-width:760px;margin:auto;padding:8px 14px 28px;text-align:center}
h1{font-size:clamp(1.8rem,6vw,2.8rem);margin:.3em 0 .1em;font-weight:900}
.sub{font-size:1.15rem;margin:0 0 18px;opacity:.85}
#snd,label:has(#i-snd){display:none}
.by{font-weight:700;font-size:1.1rem;margin:0 0 6px}
section{display:none}section.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.grid.h{grid-template-columns:repeat(2,1fr)}
.card{font:inherit;color:inherit;border:0;border-radius:30px;background:var(--cd);box-shadow:0 8px 0 var(--sh),0 14px 22px #0001;padding:14px;min-height:150px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:1.2rem}
.card:active{transform:translateY(5px);box-shadow:0 3px 0 var(--sh)}
.card svg{width:100%;max-width:130px;height:auto}
.card.m path{fill:none;stroke:var(--ac);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.g3d{font-size:4.2rem;font-weight:900;color:#ffb067;line-height:1.1;text-shadow:1px 1px 0 #c9541a,2px 2px 0 #c9541a,3px 3px 0 #c9541a,4px 4px 0 #c9541a,6px 8px 10px #0003}
.ptitle{font-size:1.5rem;font-weight:900}
.pips{display:flex;gap:10px;justify-content:center;margin:8px 0}
.pip{width:22px;height:22px;border-radius:50%;background:var(--ln);box-shadow:inset 0 -3px 0 #0002}
.pip.d{background:var(--ok)}.pip.c{outline:3px solid var(--ac)}
#msg{min-height:2em;font-size:1.2rem;font-weight:700;margin:4px 0}
.padw{position:relative;background:var(--cd);border-radius:32px;box-shadow:0 8px 0 var(--sh);width:min(100%,460px);margin:auto;padding:6px}
#pad{width:100%;height:auto;aspect-ratio:1;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.pv{position:absolute;top:10px;left:14px;font-size:2.6rem;font-weight:900;opacity:.35}
.gd{fill:none;stroke:var(--ln);stroke-width:var(--gw);stroke-linecap:round;stroke-linejoin:round}
.pl{fill:none;stroke:var(--ok);stroke-width:calc(var(--gw) + 1.5);stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.d{r:var(--dr);fill:var(--dt);transition:fill .3s}
.d.on{fill:var(--ok)}
.d.st{r:calc(var(--dr) * 1.7);fill:var(--ac);stroke:#fff;stroke-width:1}
.d.hint{animation:pu calc(1.6s * var(--sp)) ease-in-out infinite;transform-box:fill-box;transform-origin:center;fill:var(--ac)}
@keyframes pu{50%{transform:scale(1.5)}}
.ar{fill:var(--ac)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
#cel,#set{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#fff9d9d9;z-index:20;overflow:hidden;padding:16px}
#cel.on,#set.on{display:flex}
.box{background:var(--cd);border-radius:32px;padding:24px;box-shadow:0 10px 0 var(--sh);max-width:420px;width:100%;position:relative;z-index:2;text-align:center}
.big{font-size:2.4rem;font-weight:900;margin:0 0 12px;color:var(--ac)}
.bl{position:absolute;bottom:-120px;width:54px;height:68px;border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 32% 28%,#fff9 0,#fff0 28%),var(--c);box-shadow:inset -6px -8px 12px #0003;animation:rise calc(7s * var(--sp)) ease-out forwards;z-index:1}
.bl:after{content:"";position:absolute;top:100%;left:50%;width:2px;height:40px;background:#8a98ae}
@keyframes rise{to{transform:translateY(-120vh)}}
.stw{position:absolute;font-size:2rem;z-index:1;animation:fl calc(5s * var(--sp)) ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(16px) rotate(8deg)}}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0;font-weight:700;text-align:right}
input[type=range]{width:55%}
input[type=checkbox]{width:28px;height:28px}
.res{font-size:1.25rem;line-height:2}
@media (prefers-reduced-motion:reduce){.bl,.stw,.d.hint{animation-duration:12s}}
</style>
</head>

<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#ff8a3d"/></linearGradient>

<div class="bar" id="bar" style="display:none">
<button class="btn" id="back">⬅ رجوع</button>
<button class="btn" id="home">🏠 الرئيسية</button>
<span class="sp"></span>
<button class="btn" id="snd" aria-label="الصوت">🔇</button>
<button class="btn" id="gear" aria-label="الإعدادات">⚙️</button>
</div>

<main>
<section id="s-home" class="on">
<h1>هيا نتعلّم ونتتبّع</h1>
<p class="by">إعداد أ. فاطمة الرشيد</p>
<p class="sub">أتعلم خطوة بخطوة، وأرسم وأتتبّع وأكتشف!</p>
<div class="grid h" id="homeg"></div>
<div class="row"><button class="btn" id="gear2">⚙️ إعدادات ولي الأمر / المعلم</button></div>
</section>

<section id="s-menu">
<div class="ptitle" id="mt"></div>
<p class="sub">اختر ما تريد التدرّب عليه</p>
<div class="grid" id="menug"></div>
</section>

<section id="s-play">
<div class="ptitle" id="cnt"></div>
<div class="pips" id="pips"></div>
<div id="msg"></div>
<div class="padw"><div class="pv" id="pv"></div>
<svg id="pad" viewBox="0 0 100 100"></svg></div>
<div class="row"><button class="btn" id="rst">🔄 ابدأ من جديد</button><button class="btn" id="hnt">💡 تلميح</button></div>
</section>

<section id="s-res">
<h1>أحسنت يا بطل!</h1>
<div class="box" style="margin:auto"><div class="res" id="rtxt"></div>
<div class="row"><button class="btn pr" id="again">🔁 تدريب مرة أخرى</button><button class="btn" id="other">🔙 اختيار آخر</button></div></div>
</section>
</main>

<div id="cel"><div class="box"><div class="big" id="cm"></div><button class="btn pr" id="nx"></button></div></div>

<div id="set"><div class="box">
<div class="big" style="font-size:1.6rem">⚙️ الإعدادات</div>
<label>حجم النقاط<input type="range" id="i-dr" min="1.6" max="3.6" step=".2"></label>
<label>سماكة المسار<input type="range" id="i-gw" min="1" max="7" step=".5"></label>
<label>هامش السماح (سهل ← صعب)<input type="range" id="i-tol" min="4" max="13" step="1" style="direction:ltr"></label>
<label>مدة المؤثرات (أبطأ وأهدأ)<input type="range" id="i-sp" min=".7" max="3" step=".1"></label>
<label>تشغيل الأصوات<input type="checkbox" id="i-snd"></label>
<button class="btn pr" id="sclose">تم</button>
</div></div>

$('#back').onclick=function(){var a=document.querySelector('section.on').id;if(a==='s-play'||a==='s-res')toMenu(cur.k);else toHome()};
$('#home').onclick=toHome;
(function(){var g=$('#homeg');HOME.forEach(function(h){var b=document.createElement('button');b.className='card';b.innerHTML=h[2]+'<span>'+h[1]+'</span>';b.onclick=function(){toMenu(h[0])};g.appendChild(b)})})();

/* ===== جلسة التدريب (٥ محاولات) ===== */
var ST=null,ci=0,done=false,down=false,last=null,mtx=null,ht=null,pad=$('#pad');
function startSession(k,i){cur={k:k,i:i,it:DATA[k].i[i],att:1,ok:0,clean:0,rst:0};$('#pv').textContent=cur.it.g||'';show('s-play');attempt()}
function pips(){var p=$('#pips');p.innerHTML='';for(var i=1;i<=5;i++){var d=document.createElement('span');d.className='pip'+(i<=cur.ok?' d':'')+(i===cur.att&&!done?' c':'');p.appendChild(d)}}
function msg(t){$('#msg').textContent=t}
function mk(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);return e}
function attempt(){clearTimeout(ht);done=false;cur.help=false;ci=0;$('#cnt').textContent='المحاولة '+ar(cur.att)+' من '+ar(5);pips();
pad.innerHTML='';var G=4.5,layers=[mk('g',{}),mk('g',{}),mk('g',{}),mk('g',{})];layers.forEach(function(l){pad.appendChild(l)});
ST=cur.it.s.map(function(d){var gp=mk('path',{d:d,'class':'gd'});layers[0].appendChild(gp);
var len=gp.getTotalLength(),p=[];
if(len<1){var q=gp.getPointAtLength(0);p.push([q.x,q.y])}else{var c=Math.max(2,Math.round(len/G));for(var k=0;k<=c;k++){var q2=gp.getPointAtLength(len*k/c);p.push([q2.x,q2.y])}}
var pl=mk('polyline',{'class':'pl',points:''});layers[1].appendChild(pl);
var cs=p.map(function(q){var c2=mk('circle',{'class':'d',cx:q[0],cy:q[1]});layers[2].appendChild(c2);return c2});
var ar2=null;if(p.length>1){var dx=p[1][0]-p[0][0],dy=p[1][1]-p[0][1],L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
ar2=mk('path',{'class':'ar',d:'M-4.5 -4L4.5 0L-4.5 4Z',transform:'translate('+(p[0][0]-ux*9)+' '+(p[0][1]-uy*9)+') rotate('+(Math.atan2(dy,dx)*180/Math.PI)+')'});layers[3].appendChild(ar2)}
return {p:p,n:0,c:cs,pl:pl,a:ar2}});
mark();msg('ابدأ من النقطة البرتقالية 🟠 وتتبّع النقاط');ht=setTimeout(hint,6000)}
function mark(){ST.forEach(function(s,i){if(s.a)s.a.style.display=i===ci?'':'none';s.c.forEach(function(c){c.classList.remove('hint')});s.c[0].classList.toggle('st',i===ci&&s.n===0)})}
function hint(){if(done||!ST)return;var s=ST[ci],c=s.c[Math.min(s.n,s.c.length-1)];c.classList.add('hint');msg('أكمل من النقطة المضيئة 🌟')}
function paint(s){s.c.forEach(function(c,k){c.classList.toggle('on',k<s.n);if(k<s.n)c.classList.remove('hint','st')});
s.pl.setAttribute('points',s.p.slice(0,s.n).map(function(q){return q[0]+','+q[1]}).join(' '))}
function chk(x,y){if(done)return;var s=ST[ci],n=s.p.length,b=-1,hi=s.n===0?0:Math.min(s.n+3,n-1);
for(var j=s.n;j<=hi;j++)if(Math.hypot(x-s.p[j][0],y-s.p[j][1])<=S.tol)b=j;
if(b<0)return;s.n=b+1;paint(s);clearTimeout(ht);msg('أحسنت، استمر ⭐');
if(s.n>=n){ci++;if(ci>=ST.length){win();return}mark();msg('الجزء التالي: ابدأ من النقطة البرتقالية 🟠')}
ht=setTimeout(hint,6000)}
function feed(e){var p=pad.createSVGPoint();p.x=e.clientX;p.y=e.clientY;var q=p.matrixTransform(mtx);
if(last){var d=Math.hypot(q.x-last.x,q.y-last.y),n=Math.max(1,Math.ceil(d/3));for(var k=1;k<=n;k++)chk(last.x+(q.x-last.x)*k/n,last.y+(q.y-last.y)*k/n)}else chk(q.x,q.y);last={x:q.x,y:q.y}}
pad.addEventListener('pointerdown',function(e){if(S.snd){try{aud=aud||new (window.AudioContext||window.webkitAudioContext)();aud.resume()}catch(x){}}if(done||!ST)return;e.preventDefault();try{pad.setPointerCapture(e.pointerId)}catch(x){}mtx=pad.getScreenCTM().inverse();down=true;last=null;feed(e)});
pad.addEventListener('pointermove',function(e){if(down&&!done){e.preventDefault();feed(e)}});
function up(){if(!down)return;down=false;last=null;if(!done&&ST&&ST.some(function(s){return s.n>0})){cur.help=true;hint()}}
pad.addEventListener('pointerup',up);pad.addEventListener('pointercancel',up);
$('#rst').onclick=function(){if(!cur||!cur.it)return;cur.rst++;attempt();cur.help=true;msg('لا بأس، نبدأ من جديد 🌈')};
$('#hnt').onclick=function(){cur.help=true;hint()};

/* ===== النجاح والتعزيز ===== */
function win(){done=true;down=false;clearTimeout(ht);cur.ok++;if(!cur.help)cur.clean++;pips();
var o=$('#cel');o.querySelectorAll('.bl,.stw').forEach(function(e){e.remove()});
var cl=['#ff7a7a','#ffd24d','#6fd0a0','#6aa8ff','#c79bff','#ff9ed2'];
cl.forEach(function(c,i){var b=document.createElement('div');b.className='bl';b.style.cssText='--c:'+c+';left:'+(6+i*16)+'%;animation-delay:'+(i*.5)+'s';o.appendChild(b)});
for(var i=0;i<7;i++){var s=document.createElement('div');s.className='stw';s.textContent='⭐';s.style.cssText='left:'+(5+Math.random()*88)+'%;top:'+(8+Math.random()*80)+'%;animation-delay:'+(i*.4)+'s';o.appendChild(s)}
$('#cm').textContent=PRAISE[Math.floor(Math.random()*PRAISE.length)];
$('#nx').textContent=cur.att>=5?'عرض النتيجة 🏆':'المحاولة التالية ➡';o.classList.add('on');clap()}
$('#nx').onclick=function(){$('#cel').classList.remove('on');if(cur.att>=5)result();else{cur.att++;attempt()}};
function result(){var st='';for(var i=0;i<5;i++)st+=i<cur.ok?'⭐':'☆';
$('#rtxt').innerHTML='<div style="font-size:2rem">'+st+'</div>نجحت في <b>'+ar(cur.ok)+'</b> من <b>'+ar(5)+'</b> محاولات<br>بدون مساعدة: <b>'+ar(cur.clean)+'</b><br>مرات إعادة البدء: <b>'+ar(cur.rst)+'</b>';show('s-res')}
$('#again').onclick=function(){startSession(cur.k,cur.i)};
$('#other').onclick=function(){toMenu(cur.k)};

/* ===== الصوت (هادئ، معطّل افتراضيًا) ===== */
function clap(){return;try{aud=aud||new (window.AudioContext||window.webkitAudioContext)();if(aud.state==='suspended')aud.resume();var t=aud.currentTime;
for(var k=0;k<14;k++){var b=aud.createBuffer(1,4400,22050),d=b.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
var s=aud.createBufferSource();s.buffer=b;var f=aud.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;var g=aud.createGain();g.gain.value=.09;
s.connect(f);f.connect(g);g.connect(aud.destination);s.start(t+k*.1+Math.random()*.06)}}catch(e){}}

/* ===== الإعدادات ===== */
function apply(){var r=document.documentElement.style;r.setProperty('--dr',S.dr+'px');r.setProperty('--gw',S.gw);r.setProperty('--sp',S.sp);$('#snd').textContent=S.snd?'🔊':'🔇';
$('#i-dr').value=S.dr;$('#i-gw').value=S.gw;$('#i-tol').value=S.tol;$('#i-sp').value=S.sp;$('#i-snd').checked=S.snd}
[['dr','i-dr'],['gw','i-gw'],['tol','i-tol'],['sp','i-sp']].forEach(function(p){$('#'+p[1]).oninput=function(){S[p[0]]=parseFloat(this.value);apply();save()}});
$('#i-snd').onchange=function(){S.snd=this.checked;apply();save();if(S.snd)clap()};
$('#snd').onclick=function(){S.snd=!S.snd;apply();save()};
function gear(){$('#set').classList.add('on')}
$('#gear').onclick=gear;$('#gear2').onclick=gear;$('#sclose').onclick=function(){$('#set').classList.remove('on')};
apply();
})();
</script>
</body>
</html>
