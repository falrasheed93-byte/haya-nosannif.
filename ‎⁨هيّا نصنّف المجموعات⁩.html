<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هيّا نصنّف المجموعات</title>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fffdf6;font-family:'Cairo','Tahoma',Arial,sans-serif;color:#2b3a55;user-select:none;-webkit-user-select:none}
body{min-height:100vh;overflow-x:hidden}
.screen{display:none;max-width:900px;margin:0 auto;padding:14px 12px 24px}
.screen.on{display:block}
h1{margin:6px 0 2px;text-align:center;font-size:clamp(28px,7vw,44px);color:#e8590c}
.by{text-align:center;font-size:clamp(17px,4.5vw,22px);color:#3b6fb6;font-weight:700;margin:0}
.ask{text-align:center;font-size:clamp(16px,4.2vw,20px);margin:14px 6px 16px;color:#46546e}
.row{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid #ffd54f;border-radius:22px;padding:10px 14px;margin:0 auto 12px;max-width:620px}
.row img{width:78px;height:78px;object-fit:contain;border-radius:14px;flex:none}
.row b{flex:1;font-size:clamp(18px,5vw,24px)}
.go{border:0;background:#43a047;color:#fff;font:700 clamp(17px,4.5vw,21px) inherit;font-family:inherit;padding:12px 20px;border-radius:30px;box-shadow:0 4px 0 #2e7d32;cursor:pointer}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #2e7d32}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top h2{flex:1;margin:0;text-align:center;font-size:clamp(20px,5.4vw,30px);color:#e8590c}
.back{border:0;background:#fff;border:3px solid #90a4ae;border-radius:30px;font:700 17px inherit;font-family:inherit;padding:8px 16px;cursor:pointer;color:#455a64}
.zones{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.zone{flex:1 1 150px;max-width:300px;background:#fff;border:4px solid #90caf9;border-radius:22px;padding:8px;min-height:170px;text-align:center;transition:.15s}
.zone.hot{background:#fff8e1;transform:scale(1.03)}
.zone img.h{height:100px;max-width:100%;object-fit:contain}
.zone .nm{font-weight:800;font-size:clamp(18px,4.8vw,24px);margin:2px 0 4px}
.drop{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;min-height:60px}
.drop img{width:54px;height:54px;object-fit:contain}
.tray{margin-top:14px;background:#f1f8e9;border:3px dashed #9ccc65;border-radius:22px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:120px}
.slot{width:92px;height:92px;flex:none}
.item{width:92px;height:92px;object-fit:contain;background:#fff;border-radius:16px;border:2px solid #e0e0e0;touch-action:none;cursor:grab;display:block}
.item.drag{position:fixed;z-index:50;pointer-events:none;box-shadow:0 10px 24px #0004;transform:scale(1.12);cursor:grabbing}
#msg{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:100;padding:14px 30px;border-radius:40px;font-size:clamp(26px,8vw,44px);font-weight:800;color:#fff;pointer-events:none;transition:.25s;white-space:nowrap}
#msg.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#msg.ok{background:#43a047}#msg.no{background:#fb8c00}
.fx{position:fixed;z-index:90;pointer-events:none;bottom:-90px;animation:rise var(--t) ease-in forwards}
.balloon{width:46px;height:58px;border-radius:50% 50% 48% 48%;position:fixed}
.balloon:after{content:'';position:absolute;left:50%;top:100%;width:2px;height:26px;background:#78909c}
.star{font-size:34px}
@keyframes rise{to{transform:translateY(-125vh) rotate(var(--r))}}
#done{display:none;text-align:center;margin-top:18px}
#done .big{font-size:clamp(30px,9vw,52px);font-weight:800;color:#43a047;margin-bottom:12px}
#done .go{margin:4px}
.again{background:#1e88e5;box-shadow:0 4px 0 #1565c0}
</style>
</head>

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}
$('#list').innerHTML=ORDER.map(k=>`<div class="row"><img src="${D[k].icon}" alt=""><b>${D[k].title}</b><button class="go" data-k="${k}">هيا نبدأ</button></div>`).join('');
$('#list').onclick=e=>{const k=e.target.dataset.k;if(k)start(k)};
$('#back').onclick=$('#home').onclick=()=>show('menu');
$('#rep').onclick=()=>start(cur);
function start(k){
  cur=k;const g=D[k];left=g.items.length;
  $('#gt').textContent=g.title;$('#done').style.display='none';
  $('#zones').innerHTML=g.zones.map(z=>`<div class="zone" data-z="${z.id}"><img class="h" src="${z.img}" alt=""><div class="nm">${z.name}</div><div class="drop"></div></div>`).join('');
  $('#tray').style.display='flex';
  $('#tray').innerHTML='';
  shuffle(g.items).forEach(it=>{
    const s=document.createElement('div');s.className='slot';
    const im=document.createElement('img');im.className='item';im.src=it.img;im.draggable=false;im.dataset.z=it.z;
    s.appendChild(im);$('#tray').appendChild(s);drag(im,s);
  });
  show('game');
}
function zoneAt(x,y){for(const el of document.elementsFromPoint(x,y)){const z=el.closest&&el.closest('.zone');if(z)return z}return null}
function drag(im,slot){
  let dx,dy,hot=null;
  im.onpointerdown=e=>{
    e.preventDefault();im.setPointerCapture(e.pointerId);
    const r=im.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;
    im.classList.add('drag');move(e);
  };
  function move(e){im.style.left=(e.clientX-dx)+'px';im.style.top=(e.clientY-dy)+'px';
    const z=zoneAt(e.clientX,e.clientY);if(z!==hot){hot&&hot.classList.remove('hot');hot=z;hot&&hot.classList.add('hot')}}
  im.onpointermove=e=>{if(im.classList.contains('drag'))move(e)};
  im.onpointerup=e=>{
    if(!im.classList.contains('drag'))return;
    const z=zoneAt(e.clientX,e.clientY);hot&&hot.classList.remove('hot');hot=null;
    im.classList.remove('drag');im.style.left=im.style.top='';
    if(!z)return;
    if(z.dataset.z===im.dataset.z){
      const c=document.createElement('img');c.src=im.src;z.querySelector('.drop').appendChild(c);slot.remove();
      say('ممتاز يا بطل!','ok');burst(8);
      if(--left===0)finish();
    }else say('حاول مرة أخرى','no');
  };
  im.onpointercancel=()=>{im.classList.remove('drag');im.style.left=im.style.top='';hot&&hot.classList.remove('hot')};
}
function say(t,c){const m=$('#msg');m.textContent=t;m.className='show '+c;clearTimeout(msgT);msgT=setTimeout(()=>m.className='',1500)}
function burst(n){
  const cols=['#e53935','#fdd835','#1e88e5','#43a047','#8e24aa','#fb8c00'];
  for(let i=0;i<n;i++){
    const b=document.createElement('div');b.className='fx balloon';
    b.style.cssText=`background:${cols[i%6]};left:${Math.random()*90+2}vw;--t:${2.4+Math.random()*1.4}s;--r:${Math.random()*40-20}deg`;
    document.body.appendChild(b);setTimeout(()=>b.remove(),4200);
    const s=document.createElement('div');s.className='fx star';s.textContent='⭐';
    s.style.cssText=`left:${Math.random()*92+2}vw;--t:${2+Math.random()*1.6}s;--r:${Math.random()*360}deg`;
    document.body.appendChild(s);setTimeout(()=>s.remove(),4000);
  }
}
function finish(){setTimeout(()=>{$('#tray').style.display='none';$('#done').style.display='block';burst(22);window.scrollTo(0,document.body.scrollHeight)},900)}
</script>
</body>
</html>
